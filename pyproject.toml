[project]
name = "zeropp"
version = "2.0.0"
description = "Zero-shot time series foundation models vs trained EMOS/DRN for postprocessing 2 m temperature forecasts (EUPPBench)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.4",
    "pandas>=2.2",
    "pyarrow>=14",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
maps = ["cartopy>=0.22"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zeropp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
